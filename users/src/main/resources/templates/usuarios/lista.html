<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titulo} ?: 'Cadastro de Usuários'">Cadastro de Usuários</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
  <div class="container">
    <h1><a th:href="@{/usuarios}">Cadastro de Usuários</a></h1>
    <nav>
      <a th:href="@{/usuarios}">Lista</a>
      <a th:href="@{/usuarios/novo}">Novo</a>
    </nav>
  </div>
</header>

<main class="container">
  <div th:if="${msgSucesso}" class="alert success" th:text="${msgSucesso}"></div>
  <div th:if="${msgErro}" class="alert error" th:text="${msgErro}"></div>

  <section class="card">
    <div class="card-title">
      <h2>Usuários</h2>
      <a class="btn" th:href="@{/usuarios/novo}">+ Novo usuário</a>
    </div>

    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Criado em</th>
        <th class="acoes">Ações</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="u : ${usuarios}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.nome}">Fulano</td>
        <td th:text="${u.email}">fulano@exemplo.com</td>
        <td th:text="${u.telefone}">11 99999-9999</td>
        <td th:text="${#temporals.format(u.criadoEm, 'dd/MM/yyyy HH:mm')}">01/01/2025 12:00</td>
        <td class="acoes">
          <a class="btn btn-sm" th:href="@{|/usuarios/${u.id}/editar|}">Editar</a>
          <form th:action="@{|/usuarios/${u.id}/excluir|}" method="post" style="display:inline">
            <button class="btn btn-danger btn-sm" type="submit"
                    onclick="return confirm('Excluir este usuário?')">Excluir</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(usuarios)}">
        <td colspan="6" class="muted">Nenhum usuário cadastrado.</td>
      </tr>
      </tbody>
    </table>
  </section>
</main>

<footer class="footer">
</footer>
</body>
</html>
