<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${usuario.id} != null ? 'Editar usuário' : 'Novo usuário'">Novo usuário</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
  <div class="container">
    <h1><a th:href="@{/usuarios}">Cadastro de Usuários</a></h1>
    <nav>
      <a th:href="@{/usuarios}">Lista</a>
      <a th:href="@{/usuarios/novo}">Novo</a>
    </nav>
  </div>
</header>

<main class="container">
  <section class="card">
    <h2 th:text="${usuario.id} != null ? 'Editar usuário' : 'Novo usuário'">Novo usuário</h2>

    <form th:action="@{/usuarios}" method="post" th:object="${usuario}" class="form-grid">
      <input type="hidden" th:field="*{id}"/>

      <label>Nome
        <input type="text" th:field="*{nome}" placeholder="Nome completo">
        <small class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
      </label>

      <label>E-mail
        <input type="email" th:field="*{email}" placeholder="email@exemplo.com">
        <small class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
      </label>

      <label>Telefone
        <input type="text" th:field="*{telefone}" placeholder="(xx) xxxxx-xxxx">
        <small class="error" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></small>
      </label>

      <div class="actions">
        <button class="btn" type="submit">Salvar</button>
        <a class="btn btn-secondary" th:href="@{/usuarios}">Cancelar</a>
      </div>
    </form>
  </section>
</main>

<footer class="footer">
</footer>
</body>
</html>
