version: '3.8'

services:
  # --- INFRA ---
  postgres:
    image: postgres:15
    container_name: fou-postgres
    environment:
      POSTGRES_DB: fou-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fou-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # --- Services ---
  user-service:
    build: ./users
    container_name: fou-user-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fou-db
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_RABBITMQ_HOST: rabbitmq

  email-service:
    build: ./email
    container_name: fou-email-service
    ports:
      - "8082:8082"
    depends_on:
      - rabbitmq
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
